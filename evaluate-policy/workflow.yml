apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: policy-check
on:
  workflow_call:
    inputs:
      policy-id:
        description: The ID of the policy to evaluate
        type: string
        required: true
      input-data:
        description: Inline JSON input data for rule evaluation
        type: string
        required: false
      input-file:
        description: Path to a file containing JSON input data for rule evaluation
        type: string
        required: false
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
jobs:
  evaluate:
    outputs:
      policy-action: ${{ steps.policy-check.outputs.action }}
      review-channel: ${{ steps.policy-check.outputs.review-channel }}
      review-recipients: ${{ steps.policy-check.outputs.review-recipients }}
      review-timeout-minutes: ${{ steps.policy-check.outputs.review-timeout-minutes }}
    steps:
      - name: Run policy check
        id: policy-check
        uses: cloudbees-io/policy-check@v1
        with:
          policy: ${{ inputs.policy-id }}
          input-data: ${{ inputs.input-data }}
          input-file: ${{ inputs.input-file }}

  request-approval:
    needs: evaluate
    # Match both the canonical REVIEW action and the legacy REQUEST_APPROVAL name
    # so the approval flow keeps firing across the action rename rollout (CBP-47622).
    # DEPRECATED: REQUEST_APPROVAL is retained only for backwards compatibility and
    # will be removed in a future release once all policies use REVIEW.
    if: needs.evaluate.outputs.policy-action == 'REVIEW' || needs.evaluate.outputs.policy-action == 'REQUEST_APPROVAL'
    with:
      instructions: >-
        Policy evaluation requires manual approval before this workflow can
        proceed. Approvers: ${{ needs.evaluate.outputs.review-recipients }}.
      approvers: ${{ needs.evaluate.outputs.review-recipients }}
      disallowLaunchByUser: "false"
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    #timeout-minutes: ${{ needs.evaluate.outputs.review-timeout-minutes }}
